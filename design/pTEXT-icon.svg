<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151136"/>
      <stop offset="1" stop-color="#06091a"/>
    </linearGradient>
    <radialGradient id="field" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3de8ff" stop-opacity="0.18"/>
      <stop offset="0.65" stop-color="#a06bff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#a06bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFFFF"/>
      <stop offset="0.64" stop-color="#E1F6FF"/>
      <stop offset="1" stop-color="#B9DFF7"/>
    </linearGradient>
    <linearGradient id="leftEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8EF1FF"/>
      <stop offset="1" stop-color="#B8F7FF"/>
    </linearGradient>
    <linearGradient id="rightEdge" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A06BFF"/>
      <stop offset="1" stop-color="#8EF1FF"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8EF1FF"/>
      <stop offset="0.55" stop-color="#3DE8FF"/>
      <stop offset="1" stop-color="#A06BFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="27" fill="url(#bg)"/>
  <circle cx="64" cy="68" r="88" fill="url(#field)"/>
  <ellipse cx="64" cy="108" rx="44" ry="8" fill="#3DE8FF" opacity="0.14"/>

  <!-- book shadow -->
  <path d="M13 39 C30 30 49 32 64 42 C79 32 98 30 115 39 L115 105 C98 97 79 97 64 107 C49 97 30 97 13 105 Z"
        fill="#2A2360" opacity="0.7"/>

  <!-- page glows -->
  <g filter="url(#glow)">
    <path d="M15 38 C31 30 49 32 64 42 L64 103 C50 95 31 94 15 101 Z"
          fill="#3DE8FF" opacity="0.16"/>
    <path d="M113 38 C97 30 79 32 64 42 L64 103 C78 95 97 94 113 101 Z"
          fill="#A06BFF" opacity="0.16"/>
  </g>

  <!-- pages -->
  <path d="M15 38 C31 30 49 32 64 42 L64 103 C50 95 31 94 15 101 Z"
        fill="url(#page)" stroke="url(#leftEdge)" stroke-width="1.5"/>
  <path d="M113 38 C97 30 79 32 64 42 L64 103 C78 95 97 94 113 101 Z"
        fill="url(#page)" stroke="url(#rightEdge)" stroke-width="1.5"/>

  <!-- gutter -->
  <path d="M64 42 V104" fill="none" stroke="#78B4D5" stroke-width="1.4" opacity="0.55"/>

  <!-- text -->
  <g fill="none" stroke="#173B63" stroke-linecap="round">
    <path d="M25 57 H52" stroke-width="3.4"/>
    <path d="M25 67 H45" stroke-width="3.4"/>
    <path d="M25 77 H51" stroke-width="3.4"/>
    <path d="M25 87 H42" stroke-width="3.4"/>
    <path d="M76 57 H102" stroke-width="3.4"/>
    <path d="M76 67 H96" stroke-width="3.4"/>
    <path d="M76 77 H101" stroke-width="3.4"/>
    <path d="M76 87 H93" stroke-width="3.4"/>
  </g>

  <!-- reading line -->
  <path d="M16 96 C33 89 49 89 64 98 C79 89 96 89 112 96"
        fill="none" stroke="#3DE8FF" stroke-width="1.2" opacity="0.45"/>

  <!-- bookmark -->
  <path d="M86 27 H98 V62 L92 55 L86 62 Z" fill="url(#ribbon)"/>
  <path d="M86 27 H98" fill="none" stroke="#DFFBFF" stroke-width="1.4" opacity="0.8"/>

  <!-- page glint -->
  <path d="M22 41 C34 35 46 36 57 43" fill="none" stroke="#FFFFFF" stroke-width="2.4"
        stroke-linecap="round" opacity="0.5"/>
</svg>
